apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  # The platform pauses an app by overriding .Values.paused on its ArgoCD
  # Application (ADR-030); docs stay served, this workload scales to zero.
  replicas: {{ if .Values.paused }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
        # The proxy sidecar: the identity grant renders the realm, this chart renders
        # the gate. --provider=oidc (never keycloak-oidc, which audience-checks the
        # access token and 500s every callback). With one provider configured,
        # --skip-provider-button turns an unauthenticated browse into an automatic 302
        # to it, which is what the platform's app_status probe reads as "serving".
        - name: oauth2-proxy
          image: "{{ .Values.auth.proxyImage }}"
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:{{ .Values.port }}
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.auth.oidc.issuer }}
            - --client-id={{ .Values.auth.oidc.clientId }}
            - --email-domain=*
            - --cookie-secure=true
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --api-route=^/api/
          ports:
            - name: oidc
              containerPort: 4180
          env:
            # Mapped key by key, never envFrom (whose variable names would be the
            # Secret's keys rather than the ones the proxy reads).
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "set auth.oidc.existingSecret" .Values.auth.oidc.existingSecret }}
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: cookieSecret
