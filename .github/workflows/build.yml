# foundry-routines CI: a thin caller of the platform's reusable build workflow.
# The build logic lives once in foundryRB/rb-ci; this only points
# at it, so it cannot drift (INT-HOMELAB-013). Defaults apply: image names from the
# compose services, docs base = /apps/foundry-routines.
name: build

on:
    push:
        branches: [main]
    # A fork's PR runs here too: the shared workflow's release job is guarded on
    # github.event_name, so a PR gets the conformance gate and publishes nothing.
    pull_request:

jobs:
    build:
        uses: foundryRB/rb-ci/.github/workflows/build.yml@main
        with:
            app-name: foundry-routines
            runner: ubuntu-latest
        permissions:
            contents: write
            packages: write
        secrets: inherit
